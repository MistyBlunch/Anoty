services:
  mongodb:
    image: mongo:latest
    container_name: noty-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=noty_db
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: noty-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
    external: true
    name: my-app_mongo_data
  redis_data:
